<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-Hant" viewBox="0 0 420 1670" width="420" height="1670" role="img" aria-labelledby="pipeline-flow-zh-hant-mobile-title pipeline-flow-zh-hant-mobile-desc">
<title id="pipeline-flow-zh-hant-mobile-title">從原作到目錄，再到可評測發布</title><desc id="pipeline-flow-zh-hant-mobile-desc">上游工作限已收錄來源與已取得清單。標準目錄可以先發布；可評測版仍須經過語義對齊、素材建置及判分驗證。</desc>
<defs><marker id="pipeline-flow-zh-hant-mobile-known" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#398063"/></marker><marker id="pipeline-flow-zh-hant-mobile-pending" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a742c"/></marker><marker id="pipeline-flow-zh-hant-mobile-concept" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#688391"/></marker></defs>
<style>text{font-family:"Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif}.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
<rect width="420" height="1670" fill="#fff"/>
<text x="26" y="36" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">從原作到目錄，再到可評測發布</text>
<g class="diagram-node" data-node-kind="known">
      <rect x="34" y="92" width="352" height="130" rx="14" fill="#edf7f1" stroke="#398063" stroke-width="2"/>
      <text x="52" y="116" font-size="14" font-weight="650" fill="#1b654b" text-anchor="start">已有來源審閱</text>
      <text x="52" y="145" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">01 發現與篩選</text>
      <text x="52" y="176" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">250 篇書目篩查</text><text x="52" y="200" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">183 份來源審閱</text>
    </g>
<g class="diagram-node" data-node-kind="known">
      <rect x="34" y="242" width="352" height="130" rx="14" fill="#edf7f1" stroke="#398063" stroke-width="2"/>
      <text x="52" y="266" font-size="14" font-weight="650" fill="#1b654b" text-anchor="start">限已取得的快照</text>
      <text x="52" y="295" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">02 固定版本</text>
      <text x="52" y="326" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">原文、版本、hash</text><text x="52" y="350" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">保留來源及取得紀錄</text>
    </g>
<g class="diagram-node" data-node-kind="known">
      <rect x="34" y="392" width="352" height="130" rx="14" fill="#edf7f1" stroke="#398063" stroke-width="2"/>
      <text x="52" y="416" font-size="14" font-weight="650" fill="#1b654b" text-anchor="start">已有部分來源清單</text>
      <text x="52" y="445" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">03 擷取原作</text>
      <text x="52" y="476" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">任務、場景、題目 ID</text><text x="52" y="500" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">原生單位與 split 保留</text>
    </g>
<g class="diagram-node" data-node-kind="known">
      <rect x="34" y="542" width="352" height="130" rx="14" fill="#edf7f1" stroke="#398063" stroke-width="2"/>
      <text x="52" y="566" font-size="14" font-weight="650" fill="#1b654b" text-anchor="start">本次匯入驗證通過</text>
      <text x="52" y="595" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">04 統一格式</text>
      <text x="52" y="626" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">117,145 筆目錄紀錄</text><text x="52" y="650" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">可回查原始欄位</text>
    </g>
<g class="diagram-node" data-node-kind="pending">
      <rect x="34" y="870" width="352" height="130" rx="14" fill="#fff8e9" stroke="#a87b2d" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="52" y="894" font-size="14" font-weight="650" fill="#78581f" text-anchor="start">尚待逐 ID 審核</text>
      <text x="52" y="923" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">05 語義對齊</text>
      <text x="52" y="954" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">任務等價、用途對應</text><text x="52" y="978" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">場景與素材重用</text>
    </g>
<g class="diagram-node" data-node-kind="pending">
      <rect x="34" y="1020" width="352" height="130" rx="14" fill="#fff8e9" stroke="#a87b2d" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="52" y="1044" font-size="14" font-weight="650" fill="#78581f" text-anchor="start">素材與協定待齊</text>
      <text x="52" y="1073" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">06 建立測例</text>
      <text x="52" y="1104" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">輸入、初態、目標</text><text x="52" y="1128" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">觀測、動作與預算</text>
    </g>
<g class="diagram-node" data-node-kind="pending">
      <rect x="34" y="1170" width="352" height="130" rx="14" fill="#fff8e9" stroke="#a87b2d" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="52" y="1194" font-size="14" font-weight="650" fill="#78581f" text-anchor="start">尚未完成全庫驗證</text>
      <text x="52" y="1223" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">07 驗證評測</text>
      <text x="52" y="1254" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">split、正例與近失敗</text><text x="52" y="1278" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">依型別檢查判分器</text>
    </g>
<g class="diagram-node" data-node-kind="pending">
      <rect x="34" y="1320" width="352" height="130" rx="14" fill="#fff8e9" stroke="#a87b2d" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="52" y="1344" font-size="14" font-weight="650" fill="#78581f" text-anchor="start">可評測子集待建</text>
      <text x="52" y="1373" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">08 發布評測版</text>
      <text x="52" y="1404" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">驗證通過才納入</text><text x="52" y="1428" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">固定協定及版本</text>
    </g>
<path d="M 210 222 V 235" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-flow-zh-hant-mobile-known)"/>
<path d="M 210 372 V 385" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-flow-zh-hant-mobile-known)"/>
<path d="M 210 522 V 535" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-flow-zh-hant-mobile-known)"/>
<path d="M 210 1000 V 1013" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-flow-zh-hant-mobile-pending)"/>
<path d="M 210 1150 V 1163" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-flow-zh-hant-mobile-pending)"/>
<path d="M 210 1300 V 1313" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-flow-zh-hant-mobile-pending)"/>
<g class="diagram-node" data-node-kind="known">
      <rect x="34" y="705" width="352" height="112" rx="14" fill="#edf7f1" stroke="#398063" stroke-width="2"/>
      <text x="52" y="729" font-size="14" font-weight="650" fill="#1b654b" text-anchor="start">08 的目錄支線</text>
      <text x="52" y="758" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">目錄版已發布</text>
      <text x="52" y="789" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">來源、定義與題目元資料</text>
    </g>
<path d="M 210 672 V 698" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-flow-zh-hant-mobile-known)"/>
<path d="M 386 607 H 404 V 935 H 393" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-flow-zh-hant-mobile-pending)"/>
<text x="38" y="859" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">後續整合：需逐項補資料與證據</text>
<text x="34" y="1484" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">驗證未過 → 回相關步驟補件與重審</text>
<rect x="26" y="1506" width="18" height="18" rx="3" fill="#edf7f1" stroke="#398063"/>
<text x="56" y="1520" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">綠色實框：已有紀錄或驗證</text>
<rect x="26" y="1542" width="18" height="18" rx="3" fill="#fff8e9" stroke="#a87b2d" stroke-dasharray="4 3"/>
<text x="56" y="1556" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">黃色虛框：尚待審核或整合</text>
<path d="M 28 1588 H 74" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-flow-zh-hant-mobile-known)"/>
<text x="91" y="1594" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">實線：已有資料的傳遞</text>
<path d="M 28 1624 H 74" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-flow-zh-hant-mobile-pending)"/>
<text x="91" y="1630" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">虛線：須補件或驗證後成立</text>
</svg>
