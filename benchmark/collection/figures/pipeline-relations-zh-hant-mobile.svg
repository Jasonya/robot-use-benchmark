<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-Hant" viewBox="0 0 420 1310" width="420" height="1310" role="img" aria-labelledby="pipeline-relations-zh-hant-mobile-title pipeline-relations-zh-hant-mobile-desc">
<title id="pipeline-relations-zh-hant-mobile-title">領域、環境、任務如何串成測例</title><desc id="pipeline-relations-zh-hant-mobile-desc">方框表示六種資料紀錄。任務與領域、任務與環境可以多對多；測例引用目標、相容環境或觀測歷史和判分器。連線表示資料模型，不宣稱全庫對映已完成。</desc>
<defs><marker id="pipeline-relations-zh-hant-mobile-known" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#398063"/></marker><marker id="pipeline-relations-zh-hant-mobile-pending" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a742c"/></marker><marker id="pipeline-relations-zh-hant-mobile-concept" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#688391"/></marker></defs>
<style>text{font-family:"Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif}.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
<rect width="420" height="1310" fill="#fff"/>
<text x="26" y="36" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">領域、環境、任務如何串成測例</text>
<g class="diagram-node" data-node-kind="concept">
      <rect x="34" y="272" width="352" height="132" rx="14" fill="#f1f5f8" stroke="#718a99" stroke-width="2"/>
      <text x="52" y="296" font-size="14" font-weight="650" fill="#334f60" text-anchor="start">domains</text>
      <text x="52" y="325" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">領域：用途</text>
      <text x="52" y="356" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">21 類來源用途</text><text x="52" y="380" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">逐任務用途仍待對應</text>
    </g>
<g class="diagram-node" data-node-kind="concept">
      <rect x="34" y="456" width="352" height="132" rx="14" fill="#f1f5f8" stroke="#718a99" stroke-width="2"/>
      <text x="52" y="480" font-size="14" font-weight="650" fill="#334f60" text-anchor="start">tasks</text>
      <text x="52" y="509" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">任務：目標與規則</text>
      <text x="52" y="540" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">2,096 個 robot 任務條目</text><text x="52" y="564" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">另有資訊題型與人類活動</text>
    </g>
<g class="diagram-node" data-node-kind="concept">
      <rect x="34" y="644" width="352" height="132" rx="14" fill="#f1f5f8" stroke="#718a99" stroke-width="2"/>
      <text x="52" y="668" font-size="14" font-weight="650" fill="#334f60" text-anchor="start">environments</text>
      <text x="52" y="697" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">環境：場景／佈局</text>
      <text x="52" y="728" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">284 個命名場景定義</text><text x="52" y="752" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">相容性與重用需核對</text>
    </g>
<g class="diagram-node" data-node-kind="concept">
      <rect x="34" y="850" width="352" height="132" rx="14" fill="#f1f5f8" stroke="#718a99" stroke-width="2"/>
      <text x="52" y="874" font-size="14" font-weight="650" fill="#334f60" text-anchor="start">cases</text>
      <text x="52" y="903" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">測例：條件與輸入</text>
      <text x="52" y="934" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">114,288 筆題目元資料</text><text x="52" y="958" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">保留 split；素材待齊</text>
    </g>
<g class="diagram-node" data-node-kind="concept">
      <rect x="34" y="1054" width="352" height="132" rx="14" fill="#f1f5f8" stroke="#718a99" stroke-width="2"/>
      <text x="52" y="1078" font-size="14" font-weight="650" fill="#334f60" text-anchor="start">evaluators</text>
      <text x="52" y="1107" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">評估方式／判分器</text>
      <text x="52" y="1138" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">4 類評分方式</text><text x="52" y="1162" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">3 個原生判分器索引</text>
    </g>
<g class="diagram-node" data-node-kind="concept">
      <rect x="34" y="94" width="352" height="132" rx="14" fill="#f1f5f8" stroke="#718a99" stroke-width="2"/>
      <text x="52" y="118" font-size="14" font-weight="650" fill="#334f60" text-anchor="start">sources</text>
      <text x="52" y="147" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">來源：原作與證據</text>
      <text x="52" y="178" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">183 份已審閱來源</text><text x="52" y="202" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">版本、原生 ID、引用</text>
    </g>
<text x="35" y="253" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">以下各筆皆保留來源、版本與證據</text>
<path d="M 210 412 V 448" fill="none" stroke="#688391" stroke-width="2.6" marker-end="url(#pipeline-relations-zh-hant-mobile-concept)" marker-start="url(#pipeline-relations-zh-hant-mobile-concept)"/>
<text x="234" y="436" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">多對多</text>
<path d="M 210 596 V 636" fill="none" stroke="#688391" stroke-width="2.6" marker-end="url(#pipeline-relations-zh-hant-mobile-concept)" marker-start="url(#pipeline-relations-zh-hant-mobile-concept)"/>
<text x="234" y="620" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">多對多</text>
<path d="M 210 776 V 842" fill="none" stroke="#688391" stroke-width="2.6" marker-end="url(#pipeline-relations-zh-hant-mobile-concept)"/>
<text x="230" y="814" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">場景／初態</text>
<path d="M 34 522 H 14 V 916 H 27" fill="none" stroke="#688391" stroke-width="2.6" marker-end="url(#pipeline-relations-zh-hant-mobile-concept)"/>
<text x="34" y="817" font-size="14" font-weight="400" fill="#36564c" text-anchor="start">目標也直接被測例引用</text>
<path d="M 210 982 V 1046" fill="none" stroke="#688391" stroke-width="2.6" marker-end="url(#pipeline-relations-zh-hant-mobile-concept)"/>
<text x="234" y="1020" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">依此判分</text>
<text x="26" y="1220" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">方框：紀錄型別</text>
<path d="M 28 1247 H 78" fill="none" stroke="#688391" stroke-width="2.6" marker-end="url(#pipeline-relations-zh-hant-mobile-concept)" marker-start="url(#pipeline-relations-zh-hant-mobile-concept)"/>
<text x="92" y="1252" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">雙箭頭：多對多</text>
<path d="M 28 1282 H 78" fill="none" stroke="#688391" stroke-width="2.6" marker-end="url(#pipeline-relations-zh-hant-mobile-concept)"/>
<text x="92" y="1287" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">單箭頭：引用或支援</text>
</svg>
