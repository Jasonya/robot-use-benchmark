<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-Hant" viewBox="0 0 1180 830" width="1180" height="830" role="img" aria-labelledby="pipeline-example-zh-hant-wide-title pipeline-example-zh-hant-wide-desc">
<title id="pipeline-example-zh-hant-wide-title">範例：CALVIN 開抽屜如何入庫</title><desc id="pipeline-example-zh-hant-wide-desc">使用已匯入的 open_drawer 真實紀錄。原生身份、checker 與來源位置保留到標準目錄；domain_refs 和 canonical_task_id 仍待審核，不自動成為可評測題。</desc>
<defs><marker id="pipeline-example-zh-hant-wide-known" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#398063"/></marker><marker id="pipeline-example-zh-hant-wide-pending" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a742c"/></marker><marker id="pipeline-example-zh-hant-wide-concept" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#688391"/></marker></defs>
<style>text{font-family:"Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif}.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
<rect width="1180" height="830" fill="#fff"/>
<text x="36" y="36" font-size="26" font-weight="700" fill="#173c32" text-anchor="start">範例：CALVIN 開抽屜如何入庫</text>
<g class="diagram-node" data-node-kind="known">
      <rect x="36" y="108" width="338" height="242" rx="14" fill="#edf7f1" stroke="#398063" stroke-width="2"/>
      <text x="54" y="132" font-size="14" font-weight="650" fill="#1b654b" text-anchor="start">已取得 · P065</text>
      <text x="54" y="161" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">原作任務索引</text>
      <text x="54" y="192" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">native_id: open_drawer</text><text x="54" y="216" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">checker: move_door_rel</text><text x="54" y="240" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">unit: native_task_definition</text><text x="54" y="264" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">commit: fa03f01f19…</text>
    </g>
<g class="diagram-node" data-node-kind="known">
      <rect x="426" y="108" width="338" height="242" rx="14" fill="#edf7f1" stroke="#398063" stroke-width="2"/>
      <text x="444" y="132" font-size="14" font-weight="650" fill="#1b654b" text-anchor="start">已完成格式匯入</text>
      <text x="444" y="161" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">標準目錄紀錄</text>
      <text x="444" y="192" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">entity_type: task</text><text x="444" y="216" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">namespace: calvin</text><text x="444" y="240" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">native_id: open_drawer</text><text x="444" y="264" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">release_tier: catalog</text><text x="444" y="288" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">native + provenance + hash</text>
    </g>
<g class="diagram-node" data-node-kind="pending">
      <rect x="816" y="108" width="328" height="242" rx="14" fill="#fff8e9" stroke="#a87b2d" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="834" y="132" font-size="14" font-weight="650" fill="#78581f" text-anchor="start">尚待審核與驗證</text>
      <text x="834" y="161" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">成為測例前還要補</text>
      <text x="834" y="192" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">逐任務用途與等價判定</text><text x="834" y="216" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">相容場景、初態與素材</text><text x="834" y="240" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">觀測、預算、split 與判分</text><text x="834" y="264" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">可解性及近失敗檢查</text>
    </g>
<path d="M 374 229 H 418" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-example-zh-hant-wide-known)"/>
<path d="M 764 229 H 808" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-example-zh-hant-wide-pending)"/>
<g class="diagram-node" data-node-kind="pending">
      <rect x="426" y="392" width="338" height="177" rx="14" fill="#fff8e9" stroke="#a87b2d" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="444" y="416" font-size="14" font-weight="650" fill="#78581f" text-anchor="start">以下為目前欄位值</text>
      <text x="444" y="445" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">保留真實狀態</text>
      <text x="444" y="476" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">canonical_task_id: null</text><text x="444" y="500" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">domain_refs: []</text><text x="444" y="524" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">evaluation_release_eligible:</text><text x="444" y="548" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">  false</text>
    </g>
<path d="M 595 350 V 383" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-example-zh-hant-wide-known)"/>
<path d="M 494 350 V 375 H 204 V 356" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-example-zh-hant-wide-known)"/>
<text x="43" y="420" font-size="17" font-weight="400" fill="#36564c" text-anchor="start">可回查來源 YAML 第 22 行</text>
<text x="43" y="449" font-size="17" font-weight="400" fill="#36564c" text-anchor="start">原始紀錄儲存在 native</text>
<text x="43" y="478" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">欄位位置與 hash 儲存在 provenance</text>
<text x="820" y="423" font-size="17" font-weight="400" fill="#36564c" text-anchor="start">來源層級用途已歸納；</text>
<text x="820" y="451" font-size="17" font-weight="400" fill="#36564c" text-anchor="start">逐任務對應仍需寫入。</text>
<text x="40" y="620" font-size="19" font-weight="650" fill="#36564c" text-anchor="start">1 個原生任務條目 → 1 個標準目錄紀錄；格式轉換不增加任務數。</text>
<text x="40" y="658" font-size="17" font-weight="400" fill="#36564c" text-anchor="start">CALVIN 另有 34 個任務條目及 4 個場景定義；未建立合法配對前，不相乘成題數。</text>
<rect x="40" y="726" width="18" height="18" rx="3" fill="#edf7f1" stroke="#398063"/>
<text x="72" y="741" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">綠色實框：已有紀錄或驗證</text>
<rect x="545" y="726" width="18" height="18" rx="3" fill="#fff8e9" stroke="#a87b2d" stroke-dasharray="4 3"/>
<text x="577" y="741" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">黃色虛框：尚待審核或整合</text>
<path d="M 43 774 H 98" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-example-zh-hant-wide-known)"/>
<text x="118" y="780" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">實線：已有資料的傳遞</text>
<path d="M 547 774 H 602" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-example-zh-hant-wide-pending)"/>
<text x="622" y="780" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">虛線：須補件或驗證後成立</text>
</svg>
