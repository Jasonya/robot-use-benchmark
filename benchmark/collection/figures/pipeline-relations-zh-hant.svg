<path d="M 753 179 H 881" fill="none" stroke="#688391" stroke-width="2.6" marker-end="url(#pipeline-relations-zh-hant-wide-concept)" marker-start="url(#pipeline-relations-zh-hant-wide-concept)"/>
<text x="817" y="157" font-size="16" font-weight="400" fill="#36564c" text-anchor="middle">多對多</text>
<path d="M 592 250 V 366" fill="none" stroke="#688391" stroke-width="2.6" marker-end="url(#pipeline-relations-zh-hant-wide-concept)"/>
<text x="613" y="313" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">引用目標／規則</text>
<path d="M 1018 250 V 307 H 792 V 445 H 752" fill="none" stroke="#688391" stroke-width="2.6" marker-end="url(#pipeline-relations-zh-hant-wide-concept)"/>
<text x="854" y="290" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">場景／初態</text>
<path d="M 164 374 V 258" fill="none" stroke="#688391" stroke-width="2.6" marker-end="url(#pipeline-relations-zh-hant-wide-concept)"/>
<text x="178" y="315" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">用途依據</text>
<path d="M 292 445 H 432" fill="none" stroke="#688391" stroke-width="2.6" marker-end="url(#pipeline-relations-zh-hant-wide-concept)"/>
<text x="365" y="421" font-size="16" font-weight="400" fill="#36564c" text-anchor="middle">來源與證據</text>
<path d="M 744 479 H 882" fill="none" stroke="#688391" stroke-width="2.6" marker-end="url(#pipeline-relations-zh-hant-wide-concept)"/>
<text x="822" y="500" font-size="16" font-weight="400" fill="#36564c" text-anchor="middle">依此判分</text>
<text x="40" y="571" font-size="19" font-weight="650" fill="#36564c" text-anchor="start">任務＋相容場景或觀測歷史＋具體輸入與預算＋判分約定 → 測例</text>
<text x="40" y="607" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">這是資料結構圖；連線不表示全庫對映已完成。領域 × 環境 × 任務不能直接當題數。</text>
<text x="40" y="666" font-size="16" font-weight="600" fill="#36564c" text-anchor="start">圖例｜方框：紀錄型別</text>
<path d="M 370 661 H 435" fill="none" stroke="#688391" stroke-width="2.6" marker-end="url(#pipeline-relations-zh-hant-wide-concept)" marker-start="url(#pipeline-relations-zh-hant-wide-concept)"/>
<text x="452" y="666" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">多對多</text>
<path d="M 725 661 H 790" fill="none" stroke="#688391" stroke-width="2.6" marker-end="url(#pipeline-relations-zh-hant-wide-concept)"/>
