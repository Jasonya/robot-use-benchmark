<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-Hant" viewBox="0 0 1180 720" width="1180" height="720" role="img" aria-labelledby="pipeline-relations-zh-hant-wide-title pipeline-relations-zh-hant-wide-desc">
<title id="pipeline-relations-zh-hant-wide-title">領域、環境、任務如何串成測例</title><desc id="pipeline-relations-zh-hant-wide-desc">方框表示六種資料紀錄。任務與領域、任務與環境可以多對多；測例引用目標、相容環境或觀測歷史和判分器。連線表示資料模型，不宣稱全庫對映已完成。</desc>
<defs><marker id="pipeline-relations-zh-hant-wide-known" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#398063"/></marker><marker id="pipeline-relations-zh-hant-wide-pending" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a742c"/></marker><marker id="pipeline-relations-zh-hant-wide-concept" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#688391"/></marker></defs>
<style>text{font-family:"Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif}.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
<rect width="1180" height="720" fill="#fff"/>
<text x="36" y="36" font-size="26" font-weight="700" fill="#173c32" text-anchor="start">領域、環境、任務如何串成測例</text>
<g class="diagram-node" data-node-kind="concept">
      <rect x="36" y="108" width="256" height="142" rx="14" fill="#f1f5f8" stroke="#718a99" stroke-width="2"/>
      <text x="54" y="132" font-size="14" font-weight="650" fill="#334f60" text-anchor="start">domains</text>
      <text x="54" y="161" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">領域：用途</text>
      <text x="54" y="192" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">21 類來源用途</text><text x="54" y="216" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">逐任務用途仍待對應</text>
    </g>
<g class="diagram-node" data-node-kind="concept">
      <rect x="440" y="108" width="304" height="142" rx="14" fill="#f1f5f8" stroke="#718a99" stroke-width="2"/>
      <text x="458" y="132" font-size="14" font-weight="650" fill="#334f60" text-anchor="start">tasks</text>
      <text x="458" y="161" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">任務：目標與規則</text>
      <text x="458" y="192" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">2,096 個 robot 任務條目</text><text x="458" y="216" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">另有資訊題型與人類活動</text>
    </g>
<g class="diagram-node" data-node-kind="concept">
      <rect x="890" y="108" width="256" height="142" rx="14" fill="#f1f5f8" stroke="#718a99" stroke-width="2"/>
      <text x="908" y="132" font-size="14" font-weight="650" fill="#334f60" text-anchor="start">environments</text>
      <text x="908" y="161" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">環境：場景／佈局</text>
      <text x="908" y="192" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">284 個命名場景定義</text><text x="908" y="216" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">相容性與重用需核對</text>
    </g>
<g class="diagram-node" data-node-kind="concept">
      <rect x="440" y="374" width="304" height="142" rx="14" fill="#f1f5f8" stroke="#718a99" stroke-width="2"/>
      <text x="458" y="398" font-size="14" font-weight="650" fill="#334f60" text-anchor="start">cases</text>
      <text x="458" y="427" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">測例：條件與輸入</text>
      <text x="458" y="458" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">114,288 筆題目元資料</text><text x="458" y="482" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">保留 split；素材待齊</text>
    </g>
<g class="diagram-node" data-node-kind="concept">
      <rect x="890" y="374" width="256" height="142" rx="14" fill="#f1f5f8" stroke="#718a99" stroke-width="2"/>
      <text x="908" y="398" font-size="14" font-weight="650" fill="#334f60" text-anchor="start">evaluators</text>
      <text x="908" y="427" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">評估方式／判分器</text>
      <text x="908" y="458" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">4 類評分方式</text><text x="908" y="482" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">3 個原生判分器索引</text>
    </g>
<g class="diagram-node" data-node-kind="concept">
      <rect x="36" y="374" width="256" height="142" rx="14" fill="#f1f5f8" stroke="#718a99" stroke-width="2"/>
      <text x="54" y="398" font-size="14" font-weight="650" fill="#334f60" text-anchor="start">sources</text>
      <text x="54" y="427" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">來源：原作與證據</text>
      <text x="54" y="458" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">183 份已審閱來源</text><text x="54" y="482" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">版本、原生 ID、引用</text>
    </g>
