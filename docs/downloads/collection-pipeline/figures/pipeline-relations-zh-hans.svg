<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-Hans" viewBox="0 0 1180 720" width="1180" height="720" role="img" aria-labelledby="pipeline-relations-zh-hans-wide-title pipeline-relations-zh-hans-wide-desc">
<title id="pipeline-relations-zh-hans-wide-title">领域、环境、任务如何串成测例</title><desc id="pipeline-relations-zh-hans-wide-desc">方框表示六种数据纪录。任务与领域、任务与环境可以多对多；测例引用目标、兼容环境或观测历史和判分器。连接表示数据模型，不宣称全库映射已完成。</desc>
<defs><marker id="pipeline-relations-zh-hans-wide-known" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#398063"/></marker><marker id="pipeline-relations-zh-hans-wide-pending" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a742c"/></marker><marker id="pipeline-relations-zh-hans-wide-concept" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#688391"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft JhengHei",Arial,sans-serif}.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
<rect width="1180" height="720" fill="#fff"/>
<text x="36" y="36" font-size="26" font-weight="700" fill="#173c32" text-anchor="start">领域、环境、任务如何串成测例</text>
<g class="diagram-node" data-node-kind="concept">
      <rect x="36" y="108" width="256" height="142" rx="14" fill="#f1f5f8" stroke="#718a99" stroke-width="2"/>
      <text x="54" y="132" font-size="14" font-weight="650" fill="#334f60" text-anchor="start">domains</text>
      <text x="54" y="161" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">领域：用途</text>
      <text x="54" y="192" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">21 类来源用途</text><text x="54" y="216" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">逐任务用途仍待对应</text>
    </g>
<g class="diagram-node" data-node-kind="concept">
      <rect x="440" y="108" width="304" height="142" rx="14" fill="#f1f5f8" stroke="#718a99" stroke-width="2"/>
      <text x="458" y="132" font-size="14" font-weight="650" fill="#334f60" text-anchor="start">tasks</text>
      <text x="458" y="161" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">任务：目标与规则</text>
      <text x="458" y="192" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">2,096 个 robot 任务条目</text><text x="458" y="216" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">另有信息题型与人类活动</text>
    </g>
<g class="diagram-node" data-node-kind="concept">
      <rect x="890" y="108" width="256" height="142" rx="14" fill="#f1f5f8" stroke="#718a99" stroke-width="2"/>
      <text x="908" y="132" font-size="14" font-weight="650" fill="#334f60" text-anchor="start">environments</text>
      <text x="908" y="161" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">环境：场景／布局</text>
      <text x="908" y="192" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">284 个命名场景定义</text><text x="908" y="216" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">兼容性与重用需核对</text>
    </g>
<g class="diagram-node" data-node-kind="concept">
      <rect x="440" y="374" width="304" height="142" rx="14" fill="#f1f5f8" stroke="#718a99" stroke-width="2"/>
      <text x="458" y="398" font-size="14" font-weight="650" fill="#334f60" text-anchor="start">cases</text>
      <text x="458" y="427" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">测例：条件与输入</text>
      <text x="458" y="458" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">114,288 笔题目元数据</text><text x="458" y="482" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">保留 split；素材待齐</text>
    </g>
<g class="diagram-node" data-node-kind="concept">
      <rect x="890" y="374" width="256" height="142" rx="14" fill="#f1f5f8" stroke="#718a99" stroke-width="2"/>
      <text x="908" y="398" font-size="14" font-weight="650" fill="#334f60" text-anchor="start">evaluators</text>
      <text x="908" y="427" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">评估方式／判分器</text>
      <text x="908" y="458" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">4 类评分方式</text><text x="908" y="482" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">3 个原生判分器索引</text>
    </g>
<g class="diagram-node" data-node-kind="concept">
      <rect x="36" y="374" width="256" height="142" rx="14" fill="#f1f5f8" stroke="#718a99" stroke-width="2"/>
      <text x="54" y="398" font-size="14" font-weight="650" fill="#334f60" text-anchor="start">sources</text>
      <text x="54" y="427" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">来源：原作与证据</text>
      <text x="54" y="458" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">183 份已审阅来源</text><text x="54" y="482" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">版本、原生 ID、引用</text>
    </g>
