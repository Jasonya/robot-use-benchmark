<text x="367" y="157" font-size="16" font-weight="400" fill="#36564c" text-anchor="middle">多对多</text>
<path d="M 753 179 H 881" fill="none" stroke="#688391" stroke-width="2.6" marker-end="url(#pipeline-relations-zh-hans-wide-concept)" marker-start="url(#pipeline-relations-zh-hans-wide-concept)"/>
<text x="817" y="157" font-size="16" font-weight="400" fill="#36564c" text-anchor="middle">多对多</text>
<path d="M 592 250 V 366" fill="none" stroke="#688391" stroke-width="2.6" marker-end="url(#pipeline-relations-zh-hans-wide-concept)"/>
<text x="613" y="313" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">引用目标／规则</text>
<path d="M 1018 250 V 307 H 792 V 445 H 752" fill="none" stroke="#688391" stroke-width="2.6" marker-end="url(#pipeline-relations-zh-hans-wide-concept)"/>
<text x="854" y="290" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">场景／初态</text>
<path d="M 164 374 V 258" fill="none" stroke="#688391" stroke-width="2.6" marker-end="url(#pipeline-relations-zh-hans-wide-concept)"/>
<text x="178" y="315" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">用途依据</text>
<path d="M 292 445 H 432" fill="none" stroke="#688391" stroke-width="2.6" marker-end="url(#pipeline-relations-zh-hans-wide-concept)"/>
<text x="365" y="421" font-size="16" font-weight="400" fill="#36564c" text-anchor="middle">来源与证据</text>
<path d="M 744 479 H 882" fill="none" stroke="#688391" stroke-width="2.6" marker-end="url(#pipeline-relations-zh-hans-wide-concept)"/>
<text x="822" y="500" font-size="16" font-weight="400" fill="#36564c" text-anchor="middle">依此判分</text>
<text x="40" y="571" font-size="19" font-weight="650" fill="#36564c" text-anchor="start">任务＋兼容场景或观测历史＋具体输入与预算＋判分约定 → 测例</text>
<text x="40" y="607" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">这是数据结构图；连接不表示全库映射已完成。领域 × 环境 × 任务不能直接当题数。</text>
<text x="40" y="666" font-size="16" font-weight="600" fill="#36564c" text-anchor="start">图例｜方框：纪录类型</text>
<path d="M 370 661 H 435" fill="none" stroke="#688391" stroke-width="2.6" marker-end="url(#pipeline-relations-zh-hans-wide-concept)" marker-start="url(#pipeline-relations-zh-hans-wide-concept)"/>
<text x="452" y="666" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">多对多</text>
