<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-Hant" viewBox="0 0 1180 880" width="1180" height="880" role="img" aria-labelledby="pipeline-flow-zh-hant-wide-title pipeline-flow-zh-hant-wide-desc">
<title id="pipeline-flow-zh-hant-wide-title">從原作到目錄，再到可評測發布</title><desc id="pipeline-flow-zh-hant-wide-desc">上游工作限已收錄來源與已取得清單。標準目錄可以先發布；可評測版仍須經過語義對齊、素材建置及判分驗證。</desc>
<defs><marker id="pipeline-flow-zh-hant-wide-known" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#398063"/></marker><marker id="pipeline-flow-zh-hant-wide-pending" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a742c"/></marker><marker id="pipeline-flow-zh-hant-wide-concept" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#688391"/></marker></defs>
<style>text{font-family:"Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif}.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
<rect width="1180" height="880" fill="#fff"/>
<text x="36" y="36" font-size="26" font-weight="700" fill="#173c32" text-anchor="start">從原作到目錄，再到可評測發布</text>
<g class="diagram-node" data-node-kind="known">
      <rect x="36" y="86" width="240" height="146" rx="14" fill="#edf7f1" stroke="#398063" stroke-width="2"/>
      <text x="54" y="110" font-size="14" font-weight="650" fill="#1b654b" text-anchor="start">已有來源審閱</text>
      <text x="54" y="139" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">01 發現與篩選</text>
      <text x="54" y="170" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">250 篇書目篩查</text><text x="54" y="194" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">183 份來源審閱</text>
    </g>
<g class="diagram-node" data-node-kind="known">
      <rect x="310" y="86" width="240" height="146" rx="14" fill="#edf7f1" stroke="#398063" stroke-width="2"/>
      <text x="328" y="110" font-size="14" font-weight="650" fill="#1b654b" text-anchor="start">限已取得的快照</text>
      <text x="328" y="139" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">02 固定版本</text>
      <text x="328" y="170" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">原文、版本、hash</text><text x="328" y="194" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">保留來源及取得紀錄</text>
    </g>
<g class="diagram-node" data-node-kind="known">
      <rect x="584" y="86" width="240" height="146" rx="14" fill="#edf7f1" stroke="#398063" stroke-width="2"/>
      <text x="602" y="110" font-size="14" font-weight="650" fill="#1b654b" text-anchor="start">已有部分來源清單</text>
      <text x="602" y="139" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">03 擷取原作</text>
      <text x="602" y="170" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">任務、場景、題目 ID</text><text x="602" y="194" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">原生單位與 split 保留</text>
    </g>
<g class="diagram-node" data-node-kind="known">
      <rect x="858" y="86" width="240" height="146" rx="14" fill="#edf7f1" stroke="#398063" stroke-width="2"/>
      <text x="876" y="110" font-size="14" font-weight="650" fill="#1b654b" text-anchor="start">本次匯入驗證通過</text>
      <text x="876" y="139" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">04 統一格式</text>
      <text x="876" y="170" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">117,145 筆目錄紀錄</text><text x="876" y="194" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">可回查原始欄位</text>
    </g>
<g class="diagram-node" data-node-kind="pending">
      <rect x="36" y="512" width="240" height="146" rx="14" fill="#fff8e9" stroke="#a87b2d" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="54" y="536" font-size="14" font-weight="650" fill="#78581f" text-anchor="start">尚待逐 ID 審核</text>
      <text x="54" y="565" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">05 語義對齊</text>
      <text x="54" y="596" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">任務等價、用途對應</text><text x="54" y="620" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">場景與素材重用</text>
    </g>
<g class="diagram-node" data-node-kind="pending">
      <rect x="310" y="512" width="240" height="146" rx="14" fill="#fff8e9" stroke="#a87b2d" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="328" y="536" font-size="14" font-weight="650" fill="#78581f" text-anchor="start">素材與協定待齊</text>
      <text x="328" y="565" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">06 建立測例</text>
      <text x="328" y="596" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">輸入、初態、目標</text><text x="328" y="620" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">觀測、動作與預算</text>
    </g>
<g class="diagram-node" data-node-kind="pending">
      <rect x="584" y="512" width="240" height="146" rx="14" fill="#fff8e9" stroke="#a87b2d" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="602" y="536" font-size="14" font-weight="650" fill="#78581f" text-anchor="start">尚未完成全庫驗證</text>
      <text x="602" y="565" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">07 驗證評測</text>
      <text x="602" y="596" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">split、正例與近失敗</text><text x="602" y="620" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">依型別檢查判分器</text>
    </g>
<g class="diagram-node" data-node-kind="pending">
      <rect x="858" y="512" width="240" height="146" rx="14" fill="#fff8e9" stroke="#a87b2d" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="876" y="536" font-size="14" font-weight="650" fill="#78581f" text-anchor="start">可評測子集待建</text>
      <text x="876" y="565" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">08 發布評測版</text>
      <text x="876" y="596" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">驗證通過才納入</text><text x="876" y="620" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">固定協定及版本</text>
    </g>
<path d="M 276 159 H 303" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-flow-zh-hant-wide-known)"/>
<path d="M 550 159 H 577" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-flow-zh-hant-wide-known)"/>
<path d="M 824 159 H 851" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-flow-zh-hant-wide-known)"/>
<path d="M 276 585 H 303" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-flow-zh-hant-wide-pending)"/>
<path d="M 550 585 H 577" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-flow-zh-hant-wide-pending)"/>
<path d="M 824 585 H 851" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-flow-zh-hant-wide-pending)"/>
<g class="diagram-node" data-node-kind="known">
      <rect x="790" y="290" width="308" height="112" rx="14" fill="#edf7f1" stroke="#398063" stroke-width="2"/>
      <text x="808" y="314" font-size="14" font-weight="650" fill="#1b654b" text-anchor="start">08 的目錄支線</text>
      <text x="808" y="343" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">目錄版已發布</text>
      <text x="808" y="374" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">來源、定義與題目元資料</text>
    </g>
<path d="M 978 232 V 283" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-flow-zh-hant-wide-known)"/>
<text x="756" y="265" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">目錄可先發布</text>
<path d="M 1098 159 H 1134 V 465 H 156 V 505" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-flow-zh-hant-wide-pending)"/>
<text x="352" y="449" font-size="17" font-weight="400" fill="#36564c" text-anchor="start">後續整合：需逐項補資料與證據</text>
<path d="M 704 658 V 714 H 156 V 665" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-flow-zh-hant-wide-pending)"/>
<text x="305" y="704" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">驗證未過 → 回相關步驟補件與重審</text>
<text x="40" y="764" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">綠色限框內標示的範圍；不表示所有來源、素材或 task 對映都已完成。</text>
<rect x="40" y="793" width="18" height="18" rx="3" fill="#edf7f1" stroke="#398063"/>
<text x="72" y="808" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">綠色實框：已有紀錄或驗證</text>
<rect x="545" y="793" width="18" height="18" rx="3" fill="#fff8e9" stroke="#a87b2d" stroke-dasharray="4 3"/>
<text x="577" y="808" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">黃色虛框：尚待審核或整合</text>
<path d="M 43 841 H 98" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-flow-zh-hant-wide-known)"/>
<text x="118" y="847" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">實線：已有資料的傳遞</text>
<path d="M 547 841 H 602" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-flow-zh-hant-wide-pending)"/>
<text x="622" y="847" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">虛線：須補件或驗證後成立</text>
</svg>
