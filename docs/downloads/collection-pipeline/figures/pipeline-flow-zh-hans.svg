<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-Hans" viewBox="0 0 1180 880" width="1180" height="880" role="img" aria-labelledby="pipeline-flow-zh-hans-wide-title pipeline-flow-zh-hans-wide-desc">
<title id="pipeline-flow-zh-hans-wide-title">从原作到目录，再到可评测发布</title><desc id="pipeline-flow-zh-hans-wide-desc">上游工作限已收录来源与已取得清单。标准目录可以先发布；可评测版仍须经过语义对齐、素材建置及判分验证。</desc>
<defs><marker id="pipeline-flow-zh-hans-wide-known" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#398063"/></marker><marker id="pipeline-flow-zh-hans-wide-pending" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a742c"/></marker><marker id="pipeline-flow-zh-hans-wide-concept" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#688391"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft JhengHei",Arial,sans-serif}.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
<rect width="1180" height="880" fill="#fff"/>
<text x="36" y="36" font-size="26" font-weight="700" fill="#173c32" text-anchor="start">从原作到目录，再到可评测发布</text>
<g class="diagram-node" data-node-kind="known">
      <rect x="36" y="86" width="240" height="146" rx="14" fill="#edf7f1" stroke="#398063" stroke-width="2"/>
      <text x="54" y="110" font-size="14" font-weight="650" fill="#1b654b" text-anchor="start">已有来源审阅</text>
      <text x="54" y="139" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">01 发现与筛选</text>
      <text x="54" y="170" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">250 篇书目筛查</text><text x="54" y="194" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">183 份来源审阅</text>
    </g>
<g class="diagram-node" data-node-kind="known">
      <rect x="310" y="86" width="240" height="146" rx="14" fill="#edf7f1" stroke="#398063" stroke-width="2"/>
      <text x="328" y="110" font-size="14" font-weight="650" fill="#1b654b" text-anchor="start">限已取得的快照</text>
      <text x="328" y="139" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">02 固定版本</text>
      <text x="328" y="170" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">原文、版本、hash</text><text x="328" y="194" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">保留来源及取得纪录</text>
    </g>
<g class="diagram-node" data-node-kind="known">
      <rect x="584" y="86" width="240" height="146" rx="14" fill="#edf7f1" stroke="#398063" stroke-width="2"/>
      <text x="602" y="110" font-size="14" font-weight="650" fill="#1b654b" text-anchor="start">已有部分来源清单</text>
      <text x="602" y="139" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">03 截取原作</text>
      <text x="602" y="170" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">任务、场景、题目 ID</text><text x="602" y="194" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">原生单位与 split 保留</text>
    </g>
<g class="diagram-node" data-node-kind="known">
      <rect x="858" y="86" width="240" height="146" rx="14" fill="#edf7f1" stroke="#398063" stroke-width="2"/>
      <text x="876" y="110" font-size="14" font-weight="650" fill="#1b654b" text-anchor="start">本次导入验证通过</text>
      <text x="876" y="139" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">04 统一格式</text>
      <text x="876" y="170" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">117,145 笔目录纪录</text><text x="876" y="194" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">可回查原始字段</text>
    </g>
<g class="diagram-node" data-node-kind="pending">
      <rect x="36" y="512" width="240" height="146" rx="14" fill="#fff8e9" stroke="#a87b2d" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="54" y="536" font-size="14" font-weight="650" fill="#78581f" text-anchor="start">尚待逐 ID 审核</text>
      <text x="54" y="565" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">05 语义对齐</text>
      <text x="54" y="596" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">任务等价、用途对应</text><text x="54" y="620" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">场景与素材重用</text>
    </g>
<g class="diagram-node" data-node-kind="pending">
      <rect x="310" y="512" width="240" height="146" rx="14" fill="#fff8e9" stroke="#a87b2d" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="328" y="536" font-size="14" font-weight="650" fill="#78581f" text-anchor="start">素材与协定待齐</text>
      <text x="328" y="565" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">06 创建测例</text>
      <text x="328" y="596" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">输入、初态、目标</text><text x="328" y="620" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">观测、动作与预算</text>
    </g>
<g class="diagram-node" data-node-kind="pending">
      <rect x="584" y="512" width="240" height="146" rx="14" fill="#fff8e9" stroke="#a87b2d" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="602" y="536" font-size="14" font-weight="650" fill="#78581f" text-anchor="start">尚未完成全库验证</text>
      <text x="602" y="565" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">07 验证评测</text>
      <text x="602" y="596" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">split、正例与近失败</text><text x="602" y="620" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">依类型检查判分器</text>
    </g>
<g class="diagram-node" data-node-kind="pending">
      <rect x="858" y="512" width="240" height="146" rx="14" fill="#fff8e9" stroke="#a87b2d" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="876" y="536" font-size="14" font-weight="650" fill="#78581f" text-anchor="start">可评测子集待建</text>
      <text x="876" y="565" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">08 发布评测版</text>
      <text x="876" y="596" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">验证通过才纳入</text><text x="876" y="620" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">固定协定及版本</text>
    </g>
<path d="M 276 159 H 303" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-flow-zh-hans-wide-known)"/>
<path d="M 550 159 H 577" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-flow-zh-hans-wide-known)"/>
<path d="M 824 159 H 851" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-flow-zh-hans-wide-known)"/>
<path d="M 276 585 H 303" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-flow-zh-hans-wide-pending)"/>
<path d="M 550 585 H 577" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-flow-zh-hans-wide-pending)"/>
<path d="M 824 585 H 851" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-flow-zh-hans-wide-pending)"/>
<g class="diagram-node" data-node-kind="known">
      <rect x="790" y="290" width="308" height="112" rx="14" fill="#edf7f1" stroke="#398063" stroke-width="2"/>
      <text x="808" y="314" font-size="14" font-weight="650" fill="#1b654b" text-anchor="start">08 的目录支线</text>
      <text x="808" y="343" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">目录版已发布</text>
      <text x="808" y="374" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">来源、定义与题目元数据</text>
    </g>
<path d="M 978 232 V 283" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-flow-zh-hans-wide-known)"/>
<text x="756" y="265" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">目录可先发布</text>
<path d="M 1098 159 H 1134 V 465 H 156 V 505" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-flow-zh-hans-wide-pending)"/>
<text x="352" y="449" font-size="17" font-weight="400" fill="#36564c" text-anchor="start">后续集成：需逐项补数据与证据</text>
<path d="M 704 658 V 714 H 156 V 665" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-flow-zh-hans-wide-pending)"/>
<text x="305" y="704" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">验证未过 → 回相关步骤补件与重审</text>
<text x="40" y="764" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">绿色限框内标示的范围；不表示所有来源、素材或 task 映射都已完成。</text>
<rect x="40" y="793" width="18" height="18" rx="3" fill="#edf7f1" stroke="#398063"/>
<text x="72" y="808" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">绿色实框：已有纪录或验证</text>
<rect x="545" y="793" width="18" height="18" rx="3" fill="#fff8e9" stroke="#a87b2d" stroke-dasharray="4 3"/>
<text x="577" y="808" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">黄色虚框：尚待审核或集成</text>
<path d="M 43 841 H 98" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-flow-zh-hans-wide-known)"/>
<text x="118" y="847" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">实线：已有数据的传递</text>
<path d="M 547 841 H 602" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-flow-zh-hans-wide-pending)"/>
<text x="622" y="847" font-size="16" font-weight="400" fill="#36564c" text-anchor="start">虚线：须补件或验证后成立</text>
</svg>
