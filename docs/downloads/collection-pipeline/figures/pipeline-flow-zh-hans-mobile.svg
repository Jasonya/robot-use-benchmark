<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-Hans" viewBox="0 0 420 1670" width="420" height="1670" role="img" aria-labelledby="pipeline-flow-zh-hans-mobile-title pipeline-flow-zh-hans-mobile-desc">
<title id="pipeline-flow-zh-hans-mobile-title">从原作到目录，再到可评测发布</title><desc id="pipeline-flow-zh-hans-mobile-desc">上游工作限已收录来源与已取得清单。标准目录可以先发布；可评测版仍须经过语义对齐、素材建置及判分验证。</desc>
<defs><marker id="pipeline-flow-zh-hans-mobile-known" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#398063"/></marker><marker id="pipeline-flow-zh-hans-mobile-pending" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a742c"/></marker><marker id="pipeline-flow-zh-hans-mobile-concept" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#688391"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft JhengHei",Arial,sans-serif}.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
<rect width="420" height="1670" fill="#fff"/>
<text x="26" y="36" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">从原作到目录，再到可评测发布</text>
<g class="diagram-node" data-node-kind="known">
      <rect x="34" y="92" width="352" height="130" rx="14" fill="#edf7f1" stroke="#398063" stroke-width="2"/>
      <text x="52" y="116" font-size="14" font-weight="650" fill="#1b654b" text-anchor="start">已有来源审阅</text>
      <text x="52" y="145" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">01 发现与筛选</text>
      <text x="52" y="176" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">250 篇书目筛查</text><text x="52" y="200" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">183 份来源审阅</text>
    </g>
<g class="diagram-node" data-node-kind="known">
      <rect x="34" y="242" width="352" height="130" rx="14" fill="#edf7f1" stroke="#398063" stroke-width="2"/>
      <text x="52" y="266" font-size="14" font-weight="650" fill="#1b654b" text-anchor="start">限已取得的快照</text>
      <text x="52" y="295" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">02 固定版本</text>
      <text x="52" y="326" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">原文、版本、hash</text><text x="52" y="350" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">保留来源及取得纪录</text>
    </g>
<g class="diagram-node" data-node-kind="known">
      <rect x="34" y="392" width="352" height="130" rx="14" fill="#edf7f1" stroke="#398063" stroke-width="2"/>
      <text x="52" y="416" font-size="14" font-weight="650" fill="#1b654b" text-anchor="start">已有部分来源清单</text>
      <text x="52" y="445" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">03 截取原作</text>
      <text x="52" y="476" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">任务、场景、题目 ID</text><text x="52" y="500" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">原生单位与 split 保留</text>
    </g>
<g class="diagram-node" data-node-kind="known">
      <rect x="34" y="542" width="352" height="130" rx="14" fill="#edf7f1" stroke="#398063" stroke-width="2"/>
      <text x="52" y="566" font-size="14" font-weight="650" fill="#1b654b" text-anchor="start">本次导入验证通过</text>
      <text x="52" y="595" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">04 统一格式</text>
      <text x="52" y="626" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">117,145 笔目录纪录</text><text x="52" y="650" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">可回查原始字段</text>
    </g>
<g class="diagram-node" data-node-kind="pending">
      <rect x="34" y="870" width="352" height="130" rx="14" fill="#fff8e9" stroke="#a87b2d" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="52" y="894" font-size="14" font-weight="650" fill="#78581f" text-anchor="start">尚待逐 ID 审核</text>
      <text x="52" y="923" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">05 语义对齐</text>
      <text x="52" y="954" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">任务等价、用途对应</text><text x="52" y="978" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">场景与素材重用</text>
    </g>
<g class="diagram-node" data-node-kind="pending">
      <rect x="34" y="1020" width="352" height="130" rx="14" fill="#fff8e9" stroke="#a87b2d" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="52" y="1044" font-size="14" font-weight="650" fill="#78581f" text-anchor="start">素材与协定待齐</text>
      <text x="52" y="1073" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">06 创建测例</text>
      <text x="52" y="1104" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">输入、初态、目标</text><text x="52" y="1128" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">观测、动作与预算</text>
    </g>
<g class="diagram-node" data-node-kind="pending">
      <rect x="34" y="1170" width="352" height="130" rx="14" fill="#fff8e9" stroke="#a87b2d" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="52" y="1194" font-size="14" font-weight="650" fill="#78581f" text-anchor="start">尚未完成全库验证</text>
      <text x="52" y="1223" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">07 验证评测</text>
      <text x="52" y="1254" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">split、正例与近失败</text><text x="52" y="1278" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">依类型检查判分器</text>
    </g>
<g class="diagram-node" data-node-kind="pending">
      <rect x="34" y="1320" width="352" height="130" rx="14" fill="#fff8e9" stroke="#a87b2d" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="52" y="1344" font-size="14" font-weight="650" fill="#78581f" text-anchor="start">可评测子集待建</text>
      <text x="52" y="1373" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">08 发布评测版</text>
      <text x="52" y="1404" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">验证通过才纳入</text><text x="52" y="1428" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">固定协定及版本</text>
    </g>
<path d="M 210 222 V 235" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-flow-zh-hans-mobile-known)"/>
<path d="M 210 372 V 385" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-flow-zh-hans-mobile-known)"/>
<path d="M 210 522 V 535" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-flow-zh-hans-mobile-known)"/>
<path d="M 210 1000 V 1013" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-flow-zh-hans-mobile-pending)"/>
<path d="M 210 1150 V 1163" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-flow-zh-hans-mobile-pending)"/>
<path d="M 210 1300 V 1313" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-flow-zh-hans-mobile-pending)"/>
<g class="diagram-node" data-node-kind="known">
      <rect x="34" y="705" width="352" height="112" rx="14" fill="#edf7f1" stroke="#398063" stroke-width="2"/>
      <text x="52" y="729" font-size="14" font-weight="650" fill="#1b654b" text-anchor="start">08 的目录支线</text>
      <text x="52" y="758" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">目录版已发布</text>
      <text x="52" y="789" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">来源、定义与题目元数据</text>
    </g>
<path d="M 210 672 V 698" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-flow-zh-hans-mobile-known)"/>
<path d="M 386 607 H 404 V 935 H 393" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-flow-zh-hans-mobile-pending)"/>
<text x="38" y="859" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">后续集成：需逐项补数据与证据</text>
<text x="34" y="1484" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">验证未过 → 回相关步骤补件与重审</text>
<rect x="26" y="1506" width="18" height="18" rx="3" fill="#edf7f1" stroke="#398063"/>
<text x="56" y="1520" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">绿色实框：已有纪录或验证</text>
<rect x="26" y="1542" width="18" height="18" rx="3" fill="#fff8e9" stroke="#a87b2d" stroke-dasharray="4 3"/>
<text x="56" y="1556" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">黄色虚框：尚待审核或集成</text>
<path d="M 28 1588 H 74" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-flow-zh-hans-mobile-known)"/>
<text x="91" y="1594" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">实线：已有数据的传递</text>
<path d="M 28 1624 H 74" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-flow-zh-hans-mobile-pending)"/>
<text x="91" y="1630" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">虚线：须补件或验证后成立</text>
</svg>
