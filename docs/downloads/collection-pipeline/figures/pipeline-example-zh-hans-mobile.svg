<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-Hans" viewBox="0 0 420 1340" width="420" height="1340" role="img" aria-labelledby="pipeline-example-zh-hans-mobile-title pipeline-example-zh-hans-mobile-desc">
<title id="pipeline-example-zh-hans-mobile-title">范例：CALVIN 开抽屉如何入库</title><desc id="pipeline-example-zh-hans-mobile-desc">使用已导入的 open_drawer 真实纪录。原生身份、checker 与来源位置保留到标准目录；domain_refs 和 canonical_task_id 仍待审核，不自动成为可评测题。</desc>
<defs><marker id="pipeline-example-zh-hans-mobile-known" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#398063"/></marker><marker id="pipeline-example-zh-hans-mobile-pending" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a742c"/></marker><marker id="pipeline-example-zh-hans-mobile-concept" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#688391"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft JhengHei",Arial,sans-serif}.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
<rect width="420" height="1340" fill="#fff"/>
<text x="26" y="36" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">范例：CALVIN 开抽屉如何入库</text>
<g class="diagram-node" data-node-kind="known">
      <rect x="34" y="98" width="352" height="220" rx="14" fill="#edf7f1" stroke="#398063" stroke-width="2"/>
      <text x="52" y="122" font-size="14" font-weight="650" fill="#1b654b" text-anchor="start">已取得 · P065</text>
      <text x="52" y="151" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">原作任务索引</text>
      <text x="52" y="182" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">native_id: open_drawer</text><text x="52" y="206" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">checker: move_door_rel</text><text x="52" y="230" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">unit: native_task_definition</text><text x="52" y="254" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">commit: fa03f01f19…</text>
    </g>
<g class="diagram-node" data-node-kind="known">
      <rect x="34" y="366" width="352" height="246" rx="14" fill="#edf7f1" stroke="#398063" stroke-width="2"/>
      <text x="52" y="390" font-size="14" font-weight="650" fill="#1b654b" text-anchor="start">已完成格式导入</text>
      <text x="52" y="419" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">标准目录纪录</text>
      <text x="52" y="450" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">entity_type: task</text><text x="52" y="474" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">namespace: calvin</text><text x="52" y="498" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">native_id: open_drawer</text><text x="52" y="522" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">release_tier: catalog</text><text x="52" y="546" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">native + provenance + hash</text>
    </g>
<g class="diagram-node" data-node-kind="pending">
      <rect x="34" y="860" width="352" height="226" rx="14" fill="#fff8e9" stroke="#a87b2d" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="52" y="884" font-size="14" font-weight="650" fill="#78581f" text-anchor="start">尚待审核与验证</text>
      <text x="52" y="913" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">成为测例前还要补</text>
      <text x="52" y="944" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">逐任务用途与等价判定</text><text x="52" y="968" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">兼容场景、初态与素材</text><text x="52" y="992" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">观测、预算、split 与判分</text><text x="52" y="1016" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">可解性及近失败检查</text>
    </g>
<path d="M 210 318 V 358" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-example-zh-hans-mobile-known)"/>
<path d="M 210 612 V 649" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-example-zh-hans-mobile-known)"/>
<text x="231" y="345" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">转换</text>
<g class="diagram-node" data-node-kind="pending">
      <rect x="34" y="656" width="352" height="177" rx="14" fill="#fff8e9" stroke="#a87b2d" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="52" y="680" font-size="14" font-weight="650" fill="#78581f" text-anchor="start">以下为目前字段值</text>
      <text x="52" y="709" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">保留真实状态</text>
      <text x="52" y="740" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">canonical_task_id: null</text><text x="52" y="764" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">domain_refs: []</text><text x="52" y="788" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">evaluation_release_eligible:</text><text x="52" y="812" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">  false</text>
    </g>
<path d="M 386 477 H 404 V 839 H 210 V 852" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-example-zh-hans-mobile-pending)"/>
<text x="34" y="1125" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">同来源另收录 34 任务、4 场景。</text>
<text x="34" y="1152" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">这些清单不直接相乘成题数。</text>
<rect x="26" y="1172" width="18" height="18" rx="3" fill="#edf7f1" stroke="#398063"/>
<text x="56" y="1186" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">绿色实框：已有纪录或验证</text>
<rect x="26" y="1208" width="18" height="18" rx="3" fill="#fff8e9" stroke="#a87b2d" stroke-dasharray="4 3"/>
<text x="56" y="1222" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">黄色虚框：尚待审核或集成</text>
<path d="M 28 1254 H 74" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-example-zh-hans-mobile-known)"/>
<text x="91" y="1260" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">实线：已有数据的传递</text>
<path d="M 28 1290 H 74" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-example-zh-hans-mobile-pending)"/>
<text x="91" y="1296" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">虚线：须补件或验证后成立</text>
</svg>
