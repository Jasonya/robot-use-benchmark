<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-Hant" viewBox="0 0 420 1340" width="420" height="1340" role="img" aria-labelledby="pipeline-example-zh-hant-mobile-title pipeline-example-zh-hant-mobile-desc">
<title id="pipeline-example-zh-hant-mobile-title">範例：CALVIN 開抽屜如何入庫</title><desc id="pipeline-example-zh-hant-mobile-desc">使用已匯入的 open_drawer 真實紀錄。原生身份、checker 與來源位置保留到標準目錄；domain_refs 和 canonical_task_id 仍待審核，不自動成為可評測題。</desc>
<defs><marker id="pipeline-example-zh-hant-mobile-known" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#398063"/></marker><marker id="pipeline-example-zh-hant-mobile-pending" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a742c"/></marker><marker id="pipeline-example-zh-hant-mobile-concept" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#688391"/></marker></defs>
<style>text{font-family:"Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif}.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
<rect width="420" height="1340" fill="#fff"/>
<text x="26" y="36" font-size="22" font-weight="700" fill="#173c32" text-anchor="start">範例：CALVIN 開抽屜如何入庫</text>
<g class="diagram-node" data-node-kind="known">
      <rect x="34" y="98" width="352" height="220" rx="14" fill="#edf7f1" stroke="#398063" stroke-width="2"/>
      <text x="52" y="122" font-size="14" font-weight="650" fill="#1b654b" text-anchor="start">已取得 · P065</text>
      <text x="52" y="151" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">原作任務索引</text>
      <text x="52" y="182" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">native_id: open_drawer</text><text x="52" y="206" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">checker: move_door_rel</text><text x="52" y="230" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">unit: native_task_definition</text><text x="52" y="254" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">commit: fa03f01f19…</text>
    </g>
<g class="diagram-node" data-node-kind="known">
      <rect x="34" y="366" width="352" height="246" rx="14" fill="#edf7f1" stroke="#398063" stroke-width="2"/>
      <text x="52" y="390" font-size="14" font-weight="650" fill="#1b654b" text-anchor="start">已完成格式匯入</text>
      <text x="52" y="419" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">標準目錄紀錄</text>
      <text x="52" y="450" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">entity_type: task</text><text x="52" y="474" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">namespace: calvin</text><text x="52" y="498" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">native_id: open_drawer</text><text x="52" y="522" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">release_tier: catalog</text><text x="52" y="546" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">native + provenance + hash</text>
    </g>
<g class="diagram-node" data-node-kind="pending">
      <rect x="34" y="860" width="352" height="226" rx="14" fill="#fff8e9" stroke="#a87b2d" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="52" y="884" font-size="14" font-weight="650" fill="#78581f" text-anchor="start">尚待審核與驗證</text>
      <text x="52" y="913" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">成為測例前還要補</text>
      <text x="52" y="944" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">逐任務用途與等價判定</text><text x="52" y="968" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">相容場景、初態與素材</text><text x="52" y="992" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">觀測、預算、split 與判分</text><text x="52" y="1016" font-size="18" font-weight="400" fill="#36564c" text-anchor="start">可解性及近失敗檢查</text>
    </g>
<path d="M 210 318 V 358" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-example-zh-hant-mobile-known)"/>
<path d="M 210 612 V 649" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-example-zh-hant-mobile-known)"/>
<text x="231" y="345" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">轉換</text>
<g class="diagram-node" data-node-kind="pending">
      <rect x="34" y="656" width="352" height="177" rx="14" fill="#fff8e9" stroke="#a87b2d" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="52" y="680" font-size="14" font-weight="650" fill="#78581f" text-anchor="start">以下為目前欄位值</text>
      <text x="52" y="709" font-size="21" font-weight="700" fill="#173c32" text-anchor="start">保留真實狀態</text>
      <text x="52" y="740" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">canonical_task_id: null</text><text x="52" y="764" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">domain_refs: []</text><text x="52" y="788" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">evaluation_release_eligible:</text><text x="52" y="812" font-size="16" font-weight="400" fill="#36564c" text-anchor="start" class="code">  false</text>
    </g>
<path d="M 386 477 H 404 V 839 H 210 V 852" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-example-zh-hant-mobile-pending)"/>
<text x="34" y="1125" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">同來源另收錄 34 任務、4 場景。</text>
<text x="34" y="1152" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">這些清單不直接相乘成題數。</text>
<rect x="26" y="1172" width="18" height="18" rx="3" fill="#edf7f1" stroke="#398063"/>
<text x="56" y="1186" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">綠色實框：已有紀錄或驗證</text>
<rect x="26" y="1208" width="18" height="18" rx="3" fill="#fff8e9" stroke="#a87b2d" stroke-dasharray="4 3"/>
<text x="56" y="1222" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">黃色虛框：尚待審核或整合</text>
<path d="M 28 1254 H 74" fill="none" stroke="#398063" stroke-width="2.6" marker-end="url(#pipeline-example-zh-hant-mobile-known)"/>
<text x="91" y="1260" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">實線：已有資料的傳遞</text>
<path d="M 28 1290 H 74" fill="none" stroke="#9a742c" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#pipeline-example-zh-hant-mobile-pending)"/>
<text x="91" y="1296" font-size="15" font-weight="400" fill="#36564c" text-anchor="start">虛線：須補件或驗證後成立</text>
</svg>
